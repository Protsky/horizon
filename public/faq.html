<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a8ea5" />
    <title>Tropobank | FAQ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="logo-tropobank.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tropobank" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <header class="site-header">
      <a class="brand" href="app">
        <img class="brand-mark" src="logo-tropobank.svg" alt="Tropobank logo" />
        <span>Tropobank</span>
      </a>
      <button
        class="menu-toggle"
        type="button"
        data-menu-toggle
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        Menu
      </button>
      <nav class="main-menu">
        <a class="menu-link" href="app">Home</a>
        <a class="menu-link" href="search">Database</a>
        <a class="menu-link" href="support">Support</a>
        <a class="menu-link" href="settings">Settings</a>
        <a class="menu-link active" href="faq">FAQ</a>
        <a id="menuAdminLink" class="menu-link hidden" href="admin">Admin</a>
      </nav>
      <div class="header-actions">
        <a class="solid-btn" href="app">Back home</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="panel settings-page">
        <div class="dashboard-head">
          <h2>FAQ</h2>
        </div>
        <div class="settings-grid">
          <article class="card faq-item full-span">
            <h3 class="section-title">Where can I enter a coupon?</h3>
            <p>
              Go to <strong>Settings</strong>, then open the section
              <strong>Coupon / bonus code</strong>.
            </p>
            <a class="solid-btn" href="settings#couponSection">Open coupon section</a>
          </article>
        </div>
      </section>
    </main>

    <script src="nav.js"></script>
  </body>
</html>
