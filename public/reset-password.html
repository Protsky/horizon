<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a8ea5" />
    <title>Tropobank | Reset Password</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="logo-tropobank.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tropobank" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <header class="site-header">
      <a class="brand" href="app">
        <img class="brand-mark" src="logo-tropobank.svg" alt="Tropobank logo" />
        <span>Tropobank</span>
      </a>
      <button
        class="menu-toggle"
        type="button"
        data-menu-toggle
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        Menu
      </button>
      <nav class="main-menu">
        <a class="menu-link" href="app">Home</a>
        <a class="menu-link" href="forgot-password">Forgot password</a>
      </nav>
      <div class="header-actions">
        <a class="ghost-btn" href="login">Back to login</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="panel settings-page">
        <div class="dashboard-head">
          <h2>Reset password</h2>
        </div>

        <article class="card">
          <form id="resetPasswordForm" class="form">
            <label class="field-label" for="resetToken">Reset token</label>
            <input id="resetToken" type="text" required />
            <label class="field-label" for="resetNewPassword">New password</label>
            <input id="resetNewPassword" type="password" required minlength="8" autocomplete="new-password" />
            <label class="field-label" for="resetConfirmPassword">Confirm new password</label>
            <input
              id="resetConfirmPassword"
              type="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button id="resetSubmitBtn" class="solid-btn" type="submit">Reset password</button>
            <p id="resetInlineMessage" class="form-feedback hidden" role="status"></p>
          </form>
        </article>
      </section>
    </main>

    <div id="resetToast" class="toast hidden"></div>
    <script src="nav.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
