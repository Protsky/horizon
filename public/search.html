<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a8ea5" />
    <title>Tropobank | Database</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="logo-tropobank.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tropobank" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <header class="site-header">
      <a class="brand" href="app">
        <img class="brand-mark" src="logo-tropobank.svg" alt="Tropobank logo" />
        <span>Tropobank</span>
      </a>
      <button
        class="menu-toggle"
        type="button"
        data-menu-toggle
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        Menu
      </button>
      <nav class="main-menu">
        <a class="menu-link" href="app">Home</a>
        <a class="menu-link active" href="search">Database</a>
        <a class="menu-link" href="support">Support</a>
        <a class="menu-link" href="settings">Settings</a>
        <a id="menuAdminLink" class="menu-link hidden" href="admin">Admin</a>
      </nav>
      <div class="header-actions">
        <button id="searchLogoutBtn" class="ghost-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="page-shell">
      <section class="panel search-page">
        <div class="dashboard-head">
          <h2>Question database</h2>
          <p id="searchAccountSummary"></p>
        </div>

        <div id="searchGate" class="license-card hidden">
          <div>
            <h3 id="searchGateTitle">License required</h3>
            <p id="searchGateDescription"></p>
          </div>
          <button id="searchBuyLicenseBtn" class="solid-btn" type="button">Buy license</button>
        </div>

        <div id="searchShell" class="search-shell hidden">
          <label for="searchInput">Search question or feedback</label>
          <input id="searchInput" type="text" placeholder="e.g. VOR intercept, mass & balance, cold front..." />
          <small id="searchMeta" class="meta-text"></small>
          <div id="results" class="results"></div>
        </div>
      </section>
    </main>

    <div id="searchToast" class="toast hidden"></div>
    <script src="nav.js"></script>
    <script src="search.js"></script>
  </body>
</html>
