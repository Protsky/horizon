<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a8ea5" />
    <title>Tropobank | Settings</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="logo-tropobank.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tropobank" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain"></div>

    <header class="site-header">
      <a class="brand" href="app">
        <img class="brand-mark" src="logo-tropobank.svg" alt="Tropobank logo" />
        <span>Tropobank</span>
      </a>
      <button
        class="menu-toggle"
        type="button"
        data-menu-toggle
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        Menu
      </button>
      <nav class="main-menu">
        <a class="menu-link" href="app">Home</a>
        <a class="menu-link" href="search">Database</a>
        <a class="menu-link" href="support">Support</a>
        <a class="menu-link active" href="settings">Settings</a>
        <a id="menuAdminLink" class="menu-link hidden" href="admin">Admin</a>
      </nav>
      <div class="header-actions">
        <button id="settingsLogoutBtn" class="ghost-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="page-shell">
      <section class="panel settings-page">
        <div class="dashboard-head">
          <h2>User settings</h2>
          <p id="settingsAccountSummary"></p>
        </div>

        <div class="settings-grid">
          <article class="card">
            <h3 class="section-title">Current profile</h3>
            <p><strong>Name:</strong> <span id="currentName">-</span></p>
            <p><strong>Email:</strong> <span id="currentEmail">-</span></p>
            <p><strong>Role:</strong> <span id="currentRole">-</span></p>
            <p><strong>Created:</strong> <span id="currentCreatedAt">-</span></p>
            <p><strong>Subscription:</strong> <span id="currentLicenseStatus">-</span></p>
            <div class="hero-actions">
              <button id="openDatabaseBtn" class="solid-btn" type="button">Open database</button>
            </div>
          </article>

          <article class="card">
            <h3 class="section-title">Update display name</h3>
            <form id="profileForm" class="form">
              <label class="field-label" for="profileName">Display name</label>
              <input id="profileName" type="text" required minlength="2" maxlength="80" />
              <button id="saveProfileBtn" class="solid-btn" type="submit">Save profile</button>
            </form>
          </article>

          <article class="card">
            <h3 class="section-title">Change password</h3>
            <form id="passwordForm" class="form">
              <label class="field-label" for="currentPassword">Current password</label>
              <input id="currentPassword" type="password" required autocomplete="current-password" />
              <label class="field-label" for="newPassword">New password</label>
              <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" />
              <label class="field-label" for="confirmPassword">Confirm new password</label>
              <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" />
              <button id="savePasswordBtn" class="danger-btn" type="submit">Update password</button>
            </form>
          </article>

          <article class="card">
            <h3 class="section-title">Contact support</h3>
            <form id="supportForm" class="form">
              <label class="field-label" for="supportSubject">Subject</label>
              <input id="supportSubject" type="text" required minlength="3" maxlength="120" />
              <label class="field-label" for="supportMessage">Message</label>
              <textarea id="supportMessage" required minlength="10" maxlength="4000" rows="5"></textarea>
              <label class="field-label" for="supportAttachment">Photo (optional)</label>
              <input
                id="supportAttachment"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif"
              />
              <small id="supportAttachmentMeta" class="meta-text">
                Add one image (max 6 MB).
              </small>
              <button id="sendSupportBtn" class="solid-btn" type="submit">Send request</button>
            </form>
          </article>

          <article class="card full-span">
            <div class="card-head">
              <h3 class="section-title">My support requests</h3>
              <button id="refreshSupportBtn" class="ghost-btn" type="button">Refresh</button>
            </div>
            <div id="supportList" class="support-list"></div>
          </article>

          <article id="couponSection" class="card anchor-card">
            <h3 class="section-title">Coupon / bonus code</h3>
            <form id="couponRedeemForm" class="form">
              <label class="field-label" for="couponRedeemCode">Code</label>
              <input id="couponRedeemCode" type="text" maxlength="40" placeholder="FREE14BONUS" required />
              <button id="couponRedeemBtn" class="solid-btn" type="submit">Apply code</button>
            </form>
            <small id="couponRedeemMeta" class="meta-text"></small>
          </article>

          <article class="license-card" id="licenseCard">
            <div>
              <h3 id="licenseTitle">Subscription</h3>
              <p id="licenseDescription"></p>
              <p id="renewalAlert" class="renewal-alert"></p>
            </div>
            <div class="license-actions">
              <button id="buyLicenseBtn" class="solid-btn" type="button">Start subscription</button>
              <button id="toggleAutoRenewBtn" class="ghost-btn hidden" type="button"></button>
            </div>
          </article>
        </div>
      </section>
    </main>

    <div id="settingsToast" class="toast hidden"></div>
    <script src="nav.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
